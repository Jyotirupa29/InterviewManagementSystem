<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Candidate Form</title>

<link rel="stylesheet" th:href="@{/css/style.css}">

</head>
<body>

<header>

    <h1>Candidate Form</h1>

    <nav>

        <a th:href="@{/hr/dashboard}">Dashboard</a>

        <a th:href="@{/hr/candidates}">Candidate List</a>

        <a th:href="@{/logout}">Logout</a>

    </nav>

</header>

<div class="container">

<h2>Add / Update Candidate</h2>

<form th:action="@{/hr/saveCandidate}"
      th:object="${candidate}"
      method="post">

    <input type="hidden" th:field="*{id}">

    <label>Full Name</label>
    <input type="text" th:field="*{name}">
    <span class="error"
          th:if="${#fields.hasErrors('name')}"
          th:errors="*{name}"></span>

    <label>Email</label>
    <input type="email" th:field="*{email}">
    <span class="error"
          th:if="${#fields.hasErrors('email')}"
          th:errors="*{email}"></span>

    <label>Phone</label>
    <input type="text" th:field="*{phone}">
    <span class="error"
          th:if="${#fields.hasErrors('phone')}"
          th:errors="*{phone}"></span>

    <label>Qualification</label>
    <input type="text" th:field="*{qualification}">
    <span class="error"
          th:if="${#fields.hasErrors('qualification')}"
          th:errors="*{qualification}"></span>

    <label>Skills</label>
    <textarea th:field="*{skills}" rows="4"></textarea>
    <span class="error"
          th:if="${#fields.hasErrors('skills')}"
          th:errors="*{skills}"></span>

    <br><br>

    <button type="submit">Save Candidate</button>

    <button type="reset">Reset</button>

</form>

</div>

</body>
</html>
