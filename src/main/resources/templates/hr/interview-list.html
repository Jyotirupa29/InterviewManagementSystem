<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Interview List</title>

<link rel="stylesheet" th:href="@{/css/style.css}">

</head>
<body>

<header>

    <h1>Interview List</h1>

    <nav>

        <a th:href="@{/hr/dashboard}">Dashboard</a>

        <a th:href="@{/hr/candidates}">Candidates</a>

        <a th:href="@{/logout}">Logout</a>

    </nav>

</header>

<div class="container">

<h2>Scheduled Interviews</h2>

<table border="1">

    <thead>

    <tr>

        <th>ID</th>
        <th>Candidate</th>
        <th>HR</th>
        <th>Date</th>
        <th>Time</th>
        <th>Mode</th>
        <th>Location</th>
        <th>Status</th>
        <th>Actions</th>

    </tr>

    </thead>

    <tbody>

    <tr th:each="interview : ${interviews}">

        <td th:text="${interview.id}"></td>

        <td th:text="${interview.candidate.name}"></td>

        <td th:text="${interview.hr.name}"></td>

        <td th:text="${interview.interviewDate}"></td>

        <td th:text="${interview.interviewTime}"></td>

        <td th:text="${interview.mode}"></td>

        <td th:text="${interview.location}"></td>

        <td th:text="${interview.status}"></td>

        <td>

			<a th:href="@{/hr/interview/status/{id}(id=${interview.id})}">
			        <button>Update Status</button>
			    </a>

            <a th:href="@{/feedback/add/{id}(id=${interview.id})}">
                <button>Feedback</button>
            </a>

        </td>

    </tr>

    </tbody>

</table>

</div>

</body>
</html>
