<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Feedback List</title>

<link rel="stylesheet" th:href="@{/css/style.css}">

</head>

<body>

<header>

<h1>Feedback List</h1>

<nav>

<a th:href="@{/hr/dashboard}">Dashboard</a>

<a th:href="@{/interview/list}">Interview List</a>

<a th:href="@{/logout}">Logout</a>

</nav>

</header>

<div class="container">

<h2>All Feedback</h2>

<table>

<tr>

<th>ID</th>
<th>Candidate</th>
<th>Technical</th>
<th>Communication</th>
<th>Comments</th>
<th>Actions</th>

</tr>

<tr th:each="feedback : ${feedbackList}">

<td th:text="${feedback.id}"></td>

<td th:text="${feedback.interview.candidate.name}"></td>

<td th:text="${feedback.technicalRating}"></td>

<td th:text="${feedback.communicationRating}"></td>

<td th:text="${feedback.comments}"></td>

<td>

<a th:href="@{/feedback/edit/{id}(id=${feedback.id})}">
<button type="button">Edit</button>
</a>

<a th:href="@{/feedback/delete/{id}(id=${feedback.id})}"
   onclick="return confirm('Delete Feedback?')">

<button type="button">Delete</button>

</a>

</td>

</tr>

</table>

</div>

</body>

</html>
