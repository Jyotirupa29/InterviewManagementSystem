<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Candidate Registration</title>

<link rel="stylesheet" th:href="@{/css/style.css}">

</head>
<body>

<div class="register-container">

    <h1>Candidate Registration</h1>

    <form th:action="@{/saveUser}"
          th:object="${candidate}"
          method="post">

        <label>Full Name</label>
        <input type="text" th:field="*{name}">
        <span class="error"
              th:if="${#fields.hasErrors('name')}"
              th:errors="*{name}"></span>

        <label>Email</label>
        <input type="email" th:field="*{email}">
        <span class="error"
              th:if="${#fields.hasErrors('email')}"
              th:errors="*{email}"></span>

        <label>Phone Number</label>
        <input type="text" th:field="*{phone}">
        <span class="error"
              th:if="${#fields.hasErrors('phone')}"
              th:errors="*{phone}"></span>

        <label>Qualification</label>
        <input type="text" th:field="*{qualification}">
        <span class="error"
              th:if="${#fields.hasErrors('qualification')}"
              th:errors="*{qualification}"></span>

        <label>Skills</label>
        <input type="text" th:field="*{skills}">
        <span class="error"
              th:if="${#fields.hasErrors('skills')}"
              th:errors="*{skills}"></span>

        <label>Username</label>
        <input type="text" name="username" placeholder="Choose Username" required>

        <label>Password</label>
        <input type="password" name="password" placeholder="Choose Password" required>

        <button type="submit">Register</button>

    </form>

    <p>
        Already have an account?
        <a th:href="@{/login}">Login Here</a>
    </p>

</div>

</body>
</html>
