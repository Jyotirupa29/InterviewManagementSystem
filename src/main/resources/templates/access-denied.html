<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Access Denied</title>

<link rel="stylesheet" th:href="@{/css/style.css}">

<style>

body{
    margin:0;
    padding:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#f4f4f4;
}

.container{
    width:500px;
    margin:120px auto;
    background:white;
    padding:40px;
    text-align:center;
    border-radius:10px;
    box-shadow:0 0 15px rgba(0,0,0,0.2);
}

h1{
    color:red;
    font-size:60px;
}

h2{
    color:#333;
}

p{
    color:#666;
    margin-bottom:30px;
}

a{
    text-decoration:none;
}

button{
    padding:12px 25px;
    border:none;
    background:#007BFF;
    color:white;
    font-size:16px;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#0056b3;
}

</style>

</head>
<body>

<div class="container">

<h1>403</h1>

<h2>Access Denied</h2>

<p>
You don't have permission to access this page.
</p>

<a th:href="@{/login}">
<button>Back to Login</button>
</a>

</div>

</body>
</html>
